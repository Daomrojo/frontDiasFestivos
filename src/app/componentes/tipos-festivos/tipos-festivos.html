<mat-card class="tarjeta">
  <mat-card-header>
    <mat-card-title>{{ editando ? 'Editar Tipo de Festivo' : 'Nuevo Tipo de Festivo' }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="guardar()" class="formulario">
      <mat-form-field appearance="outline" class="campo-nombre">
        <mat-label>Tipo de Festivo</mat-label>
        <input matInput [(ngModel)]="tipoActual.tipo" name="tipo" required placeholder="Ej. Fijo, Ley Puente Festivo..." />
      </mat-form-field>

      <div class="botones">
        <button mat-raised-button color="primary" type="submit">
          <mat-icon>{{ editando ? 'save' : 'add' }}</mat-icon>
          {{ editando ? 'Actualizar' : 'Agregar' }}
        </button>

        @if (editando) {
          <button mat-stroked-button type="button" (click)="cancelar()">
            Cancelar
          </button>
        }
      </div>
    </form>
  </mat-card-content>
</mat-card>

<mat-card class="tarjeta">
  <mat-card-header>
    <mat-card-title>Listado de Tipos de Festivo</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <table mat-table [dataSource]="tipos" class="tabla-completa">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let t">{{ t.id }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let t">{{ t.tipo }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="col-acciones">Acciones</th>
        <td mat-cell *matCellDef="let t" class="col-acciones">
          <button mat-icon-button color="primary" (click)="editar(t)" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminar(t.id)" title="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card-content>
</mat-card>
